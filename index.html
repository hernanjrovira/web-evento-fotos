<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sube tus fotos del evento</title>
<meta name="description" content="Compartí tus fotos y videos del evento en un toque, sin login." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="flash" id="flash" aria-hidden="true"></div>

  <main class="page">

    <header class="intro">
      <p class="eyebrow">Álbum del evento</p>
      <h1 class="heading">Sube tus fotos<br>del evento</h1>
      <p class="subheading">Elegí las fotos y videos que quieras compartir. Sin cuentas, sin contraseñas.</p>
    </header>

    <form id="upload-form" class="uploader" novalidate>

      <label for="file-input" class="dropzone" id="dropzone">
        <span class="corner corner--tl" aria-hidden="true"></span>
        <span class="corner corner--tr" aria-hidden="true"></span>
        <span class="corner corner--bl" aria-hidden="true"></span>
        <span class="corner corner--br" aria-hidden="true"></span>

        <svg class="dropzone-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect x="6" y="18" width="52" height="38" rx="4" stroke="currentColor" stroke-width="3"/>
          <path d="M6 24 L20 18 H44 L58 24" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="32" cy="38" r="10" stroke="currentColor" stroke-width="3"/>
          <circle cx="48" cy="26" r="2.4" fill="currentColor"/>
        </svg>

        <span class="dropzone-text">
          <strong>Arrastrá tus archivos aquí</strong>
          <span>o tocá para elegir desde tu galería</span>
        </span>

        <input
          type="file"
          id="file-input"
          name="files"
          accept="image/*,video/*"
          multiple
          class="file-input"
        />
      </label>

      <ul class="file-list" id="file-list" aria-live="polite"></ul>

      <button type="submit" class="submit-btn" id="submit-btn" disabled>
        Subir
      </button>

      <div class="progress-wrap" id="progress-wrap" hidden>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-label" id="progress-label">Subiendo 0%</p>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

    </form>

    <footer class="foot-note">
      Tus fotos se suben directo a la nube del evento. Nadie necesita crear una cuenta.
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
